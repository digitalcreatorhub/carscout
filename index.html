<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarScout">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CarScout Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>

/* Layout: dark fintech dashboard. Intake form in a glass card on the left, result cards stacked on the right (one column on phones).
   Identity: Baltic number plate brand, amber accent, prices and VIN in mono, price ruler and cost calculator as the core visuals. */
:root{
  color-scheme:dark;
  --bg:#08080A; --top-bg:rgba(8,8,10,.72);
  --surface:rgba(255,255,255,.04); --surface-2:rgba(255,255,255,.07); --field:rgba(255,255,255,.05);
  --ink:#F3F3F5; --muted:#9C9CA6; --line:rgba(255,255,255,.09);
  --accent:#FFB700; --accent-fg:#1A1200; --accent-soft:rgba(255,183,0,.14); --series2:#5CC8D2;
  --info:#7FB2FF; --info-soft:rgba(127,178,255,.14);
  --good:#3DD68C; --good-soft:rgba(61,214,140,.14); --warn:#FF9A52; --warn-soft:rgba(255,154,82,.14);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.14); --sus:#C99BFF; --sus-soft:rgba(201,155,255,.14);
  --plate-bg:#FFFFFF; --plate-fg:#111111; --plate-eu:#0B3A9B;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 420px at 12% -8%,rgba(255,183,0,.10),transparent 70%),var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 56px}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.glass{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* header */
.top{margin-inline:-16px;padding-inline:16px;background:var(--top-bg);border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.plate{display:inline-flex;align-items:stretch;border:2px solid var(--plate-fg);border-radius:7px;overflow:hidden;background:var(--plate-bg);color:var(--plate-fg);line-height:1;flex:none}
.plate .eu{background:var(--plate-eu);color:#fff;font-size:10px;font-weight:600;padding:5px 5px;display:flex;align-items:flex-end;letter-spacing:.04em}
.plate .pt{font-size:17px;font-weight:700;letter-spacing:.1em;padding:6px 9px}
.brand .sub{color:var(--muted);font-size:13px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{font-weight:600;font-size:13px;padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.lead{padding-block:30px 20px;max-width:800px}
.lead h1{font:700 clamp(28px,5.4vw,44px)/1.08 var(--f-body);letter-spacing:-.025em;text-wrap:balance;margin-bottom:12px}
.lead p{color:var(--muted);max-width:64ch}

.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:960px){.grid{grid-template-columns:minmax(0,390px) minmax(0,1fr)}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.intake{padding:20px;display:flex;flex-direction:column;gap:18px}
#out{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sec>.sh{margin-bottom:14px}
.sh{font:600 12.5px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

/* form */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lbl{font-weight:500;font-size:13px}
.in{background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-width:0}
.in.lg{padding:14px 14px;font-size:16px}
.in:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select.in option{background:#17171B;color:#F3F3F5}
textarea.in{resize:vertical;min-height:84px}
.mono{font-family:var(--f-mono);letter-spacing:.06em}
.hint{font-size:12.5px;color:var(--muted)}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r);padding:16px 12px;color:var(--muted);cursor:pointer;background:var(--field);min-height:80px;font-size:14px}
.needshot{margin-top:10px;padding:12px 14px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r);display:grid;gap:8px}
.needshot[hidden]{display:none}
.needshot .ns-t{margin:0;font-weight:600;color:var(--ink);font-size:14px}
.drop.pulse{border-color:var(--accent);color:var(--ink);animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,183,0,.18)}}
@media (prefers-reduced-motion:reduce){.drop.pulse{animation:none}}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:1;cursor:pointer;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{font-weight:600;font-size:15px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);flex:1 1 180px}
.btn.sm{padding:5px 12px;min-height:34px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:var(--surface-2);color:var(--ink)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.st{border-radius:12px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.st.busy{background:var(--accent-soft)}
.st.err{background:var(--bad-soft);color:var(--bad)}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.info{background:var(--surface-2);color:var(--muted)}
.ind{height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative;margin-top:8px;flex-basis:100%}
.ind::after{content:"";position:absolute;inset:0 auto 0 -35%;width:35%;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{to{left:100%}}
@media (prefers-reduced-motion:reduce){.ind::after{animation:none;left:0;width:100%;opacity:.5}}
details.imp{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
details.imp summary{cursor:pointer;font-weight:600;font-size:14px}
details.imp[open] summary{margin-bottom:12px}

/* profile + verdict */
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.prof{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-bottom:16px}
.pthumb{width:200px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.pmain{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px}
.pmain h2{font:700 clamp(24px,4vw,32px)/1.1 var(--f-body);letter-spacing:-.02em;text-wrap:balance}
.price{font:600 clamp(26px,5vw,36px)/1.1 var(--f-mono);color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.vhead{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.vhead .sh{margin:0}
.vmain{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-bottom:16px}
.vplate{border:1.5px solid currentColor;border-radius:var(--r);padding:14px 18px;display:flex;flex-direction:column;gap:3px;min-width:190px}
.vscore{font:600 44px/1 var(--f-mono);letter-spacing:-.02em}
.vscore small{font-size:16px;font-weight:500;opacity:.7;margin-left:3px}
.vplate .vk{font-weight:700;font-size:17px;margin-top:4px}
.vplate .vlv{font:500 13px var(--f-mono);opacity:.85}
.vplate .vd{font:500 13px var(--f-mono);margin-top:4px}
.vplate.good{color:var(--good);background:var(--good-soft)}
.vplate.fair{color:var(--info);background:var(--info-soft)}
.vplate.high{color:var(--warn);background:var(--warn-soft)}
.vplate.overpriced{color:var(--bad);background:var(--bad-soft)}
.vplate.too_cheap{color:var(--sus);background:var(--sus-soft)}
.vplate.unknown{color:var(--muted);background:var(--surface-2)}
.vtext{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.headline{font-weight:600;font-size:16.5px;text-wrap:balance}
.sumbox{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--accent);padding-left:14px;margin-bottom:16px}
.sumbox .lv{color:var(--muted);font-size:14px}
.lvtag{display:inline-block;font:600 10.5px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--ink)}
.dots li{position:relative;padding-left:16px;font-size:14px}
.dots li::before{content:"";position:absolute;left:2px;top:.66em;width:6px;height:6px;border-radius:2px;background:var(--muted)}
.dots.bad li::before{background:var(--bad)}
.dots.good li::before{background:var(--good)}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.high{background:var(--good-soft);color:var(--good)}
.pill.medium{background:var(--info-soft);color:var(--info)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}

/* ruler */
.ruler{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.rlegend{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.askkey{display:inline-block;width:0;height:16px;border-left:2px dashed var(--ink)}
.rrow{display:flex;flex-direction:column;gap:5px}
.rlab{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rbar{position:relative;height:14px;background:var(--surface-2);border-radius:7px;border:1px solid var(--line)}
.rrange{position:absolute;top:-1px;bottom:-1px;min-width:4px;border-radius:7px;background:var(--accent)}
.rrange.cp{background:var(--series2)}
.rwhisk{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--muted);opacity:.7}
.rmid{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:1px}
.askmark{position:absolute;top:-7px;bottom:-7px;width:0;border-left:2px dashed var(--ink)}
.rnum{font:13px var(--f-mono);font-variant-numeric:tabular-nums}
.rnum span{color:var(--muted)}

/* generic blocks */
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 18px}
.kv div{min-width:0}
.kv dt{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kv dd{font-weight:500;overflow-wrap:anywhere}
.stack{display:flex;flex-direction:column;gap:14px}
.vin{display:flex;flex-wrap:wrap;gap:8px 6px}
.vg{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.vg b{font:500 16px var(--f-mono);letter-spacing:.1em;border:1px solid var(--line);background:var(--field);padding:4px 7px;border-radius:6px}
.vg small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ok{color:var(--good)} .wn{color:var(--warn)} .bd{color:var(--bad)}
.two{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.two h4,.sub-h{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--surface)}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:600 20px/1.2 var(--f-mono);overflow-wrap:anywhere}
.chk{display:flex;gap:10px;align-items:flex-start;padding-block:5px;font-size:14px}
.chk input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.chk.done span{color:var(--muted);text-decoration:line-through}
.alt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding-block:10px;border-top:1px solid var(--line)}
.alt:first-of-type{border-top:0}
.alt .p{font:500 13.5px var(--f-mono)}

/* regions */
.bars{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.brow{display:grid;grid-template-columns:minmax(92px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.brow .bt{height:12px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.brow .bt i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--series2)}
.brow.me .bt i{background:var(--accent)}
.brow .bv{font:500 13px var(--f-mono);text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font:13.5px var(--f-mono);white-space:nowrap}
.tbl .rn{font-size:12.5px;color:var(--muted);max-width:34ch}
.dpos{color:var(--bad)} .dneg{color:var(--good)}
.sbtn{display:inline-flex;padding:3px 10px;border:1px solid var(--line);border-radius:8px;color:var(--accent);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}
.sbtn:hover{border-color:var(--accent)}
.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* charts */
.chart{margin-block:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font:11px var(--f-body)}
.chart .pt{fill:var(--series2);fill-opacity:.85}
.chart .fit{stroke:var(--series2);stroke-width:1.5;stroke-dasharray:5 4}
.chart .me{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .area{fill:var(--accent-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.chart .vl{fill:var(--ink);font:500 11.5px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--series2);margin-right:6px}
.sw.me{background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.cap{font-size:12px;color:var(--muted)}
.cadd{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));align-items:end}
.cadd .fld:last-of-type{grid-column:1/-1}

/* insights */
.ins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ib{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface)}
.ib.wide{grid-column:1/-1}
.ib .v{font:600 20px/1.2 var(--f-mono)}

/* calculator */
.calc{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cbox{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.cbox h4{font:600 14px var(--f-body)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:10px;align-items:center;font-size:13.5px}
.crow .in{padding:7px 9px;font-family:var(--f-mono);text-align:right}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.ctotal b{font:600 24px/1 var(--f-mono);color:var(--accent)}
.cdiff{font-weight:600}

.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.res a{display:inline-flex;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:10px;color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:var(--surface-2)}
.links a:hover,.res a:hover{border-color:var(--accent)}
.links a:focus-visible,.res a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.res li:first-child{border-top:0}
.sl{display:flex;flex-direction:column}
.sl li{display:flex;gap:8px;align-items:stretch;border-top:1px solid var(--line)}
.sl li:first-child{border-top:0}
.sl .open{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:10px 4px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;align-items:center}
.sl .open:hover{background:var(--surface-2)}
.sl .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sl .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sl .m{font:12.5px var(--f-mono);color:var(--muted)}
.foot{margin-top:20px;font-size:12.5px;color:var(--muted);max-width:84ch;display:flex;flex-direction:column;gap:8px}

/* ===== v4 skin: ultra-modern aurora glass ===== */
:root{
  --bg:#05060B; --top-bg:rgba(14,15,26,.55);
  --surface:rgba(255,255,255,.035); --surface-2:rgba(255,255,255,.07); --field:rgba(255,255,255,.045);
  --ink:#F4F5FA; --muted:#98A0B8; --line:rgba(255,255,255,.1);
  --accent:#9D8CFF; --accent-fg:#0B0620; --accent-soft:rgba(157,140,255,.16); --series2:#34E5E0;
  --grad:linear-gradient(120deg,#7C5CFF 0%,#3B9BFF 52%,#2DE2E6 100%);
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --r:24px; --r-sm:14px;
}
html{scrollbar-color:#2a2d44 transparent}
body{background:var(--bg);position:relative;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 36% at 14% 8%,rgba(124,92,255,.38),transparent 70%),
             radial-gradient(34% 32% at 88% 14%,rgba(45,226,230,.22),transparent 70%),
             radial-gradient(42% 40% at 70% 92%,rgba(59,155,255,.2),transparent 70%),
             radial-gradient(30% 30% at 6% 86%,rgba(255,92,170,.12),transparent 70%);
  filter:blur(30px);animation:aurora 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent 80%);mask-image:radial-gradient(70% 55% at 50% 0%,#000,transparent 80%)}
@keyframes aurora{to{transform:translate3d(3%,2%,0) scale(1.08) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}

/* header: floating glass pill */
.top{position:sticky;top:10px;z-index:20;margin:10px auto 0;max-width:1180px;padding-inline:6px;border:1px solid var(--line);border-radius:20px;

.top .bar{padding-block:8px;padding-inline:8px}
.plate{border:0;border-radius:12px;background:var(--grad);color:#07101F;box-shadow:0 6px 24px -6px rgba(91,130,255,.7)}
.plate .eu{display:none}
.plate .pt{font:700 15px var(--f-display);letter-spacing:.02em;padding:8px 13px;text-transform:none}
.plate .pt::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#07101F;margin-right:8px;vertical-align:1px;box-shadow:0 0 0 3px rgba(7,16,31,.25)}
.seg{border-radius:999px;padding:3px;background:rgba(255,255,255,.05)}
.seg button{border-radius:999px;padding:5px 13px}
.seg button[aria-pressed="true"]{background:var(--grad);color:#07101F}

/* hero */
.lead{padding-block:52px 30px;max-width:900px}
.lead h1{font:700 clamp(34px,7.2vw,68px)/1.02 var(--f-display);letter-spacing:-.04em;background:linear-gradient(120deg,#fff 0%,#C9C2FF 45%,#74F0EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}
.lead p{font-size:clamp(15px,2.2vw,18px);max-width:60ch;color:#B3BAD0}

/* glass cards with gradient hairline */
.sheet,.sec{border:1px solid transparent;border-radius:var(--r);
  background:linear-gradient(rgba(13,14,24,.74),rgba(13,14,24,.74)) padding-box,
             linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 38%,rgba(157,140,255,.32) 100%) border-box;

.intake{padding:22px;gap:20px}
.sec{padding:24px}
.sh{font:600 11.5px/1.2 var(--f-display);letter-spacing:.16em;color:#8E96B3;display:flex;align-items:center;gap:10px}
.sh::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--grad)}
#out>.sec{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
#out>.sec:nth-child(2){animation-delay:.05s}#out>.sec:nth-child(3){animation-delay:.1s}#out>.sec:nth-child(4){animation-delay:.15s}#out>.sec:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (prefers-reduced-motion:reduce){#out>.sec{animation:none}}

/* inputs and buttons */
.in{border-radius:var(--r-sm);padding:12px 14px;background:rgba(255,255,255,.04);transition:border-color .15s,box-shadow .15s,background .15s}

.btn.pri{background:var(--grad);border:0;color:#07101F;font-weight:700;box-shadow:0 12px 32px -10px rgba(76,130,255,.8),inset 0 1px 0 rgba(255,255,255,.35);min-height:50px;font-size:16px}

.chip{background:rgba(255,255,255,.05);backdrop-filter:blur(8px)}
button.chip:hover{border-color:#8F7BFF;background:var(--accent-soft)}
.drop{border-radius:20px;border:1.5px dashed rgba(157,140,255,.45);background:linear-gradient(180deg,rgba(124,92,255,.08),rgba(45,226,230,.04));min-height:92px}

.needshot{border-radius:20px;border-color:rgba(255,154,82,.55)}

.pthumb{border-radius:18px}

.stat,.ib,.cbox{border-radius:18px;background:rgba(255,255,255,.04);transition:border-color .2s,transform .2s}
.ib:hover,.stat:hover{border-color:rgba(157,140,255,.4)}
.stat b,.ib .v{font-family:var(--f-display);font-weight:700}

.sbtn,.links a,.res a{color:#C9C2FF;border-radius:12px;background:rgba(255,255,255,.04);transition:border-color .15s,background .15s}
.sbtn:hover,.links a:hover,.res a:hover{border-color:#8F7BFF;background:var(--accent-soft)}
.chk input{accent-color:#8F7BFF}

.foot{opacity:.85}
@media (max-width:640px){
  body{padding-inline:12px}.top{top:6px;border-radius:16px}

      if(key==='sport'&&!/^(audi|bmw|volkswagen|mercedes)$/.test(mk)) return;
      var one=function(n){ return n.split(/[\s\-]+/).map(function(t){ return /^standard$/i.test(t)?'Standar[dt]':esc(t); }).join('[\\s\\-]?'); };
      var src=names.map(one).join('|'), strict=/^[A-Z0-9]/.test(name);
      arr.push({key:key,name:name,re:new RegExp('(^|[^A-Za-z0-9Ѐ-ӿ])('+src+')(?![A-Za-z0-9Ѐ-ӿ])','ig'),strict:strict});

function makeKey(make){
  var m=String(make||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  if(!m) return ''; if(/^(vw|volkswagen)/.test(m)) return 'volkswagen';
  if(/^land[\s\-]?rover/.test(m)) return 'land rover'; if(/^alfa/.test(m)) return 'alfa romeo';
  return m.split(/[\s\-]+/)[0];
}
function mtHit(x,t,loose){
  x.re.lastIndex=0; var m;
  while((m=x.re.exec(t))){ if(loose||!x.strict||/^[A-Z0-9]/.test(m[2])) return true; if(m.index===x.re.lastIndex) x.re.lastIndex++; }

}

function detectTrim(text,make,loose,full){
  var t=String(text||''), out=[]; TRIMS.forEach(function(x){ if(x[1].test(t)) out.push(x[0]); });
  var list=MT_BY_MAKE[makeKey(make)];
  if(list){ var t2=(loose||full)?t:t.slice(0,1500); list.forEach(function(x){ if(out.indexOf(x.key)<0&&mtHit(x,t2,loose)) out.push(x.key); }); }
  if(out.indexOf('amg-line')>-1) out=out.filter(function(k){return k!=='amg'});
  function tk(k){ return ' '+k.replace(/[\s\-]+/g,' ')+' '; }
  return out.filter(function(k){ var s=tk(k); return !out.some(function(o){ return o!==k&&o.length>k.length&&tk(o).indexOf(s)>-1; }); });
}
function mergeTrims(x,y){ var o=x.slice(); y.forEach(function(k){ if(o.indexOf(k)<0) o.push(k); }); return o.filter(function(k){ var s=' '+k.replace(/[\s\-]+/g,' ')+' '; return !o.some(function(q){ return q!==k&&q.length>k.length&&(' '+q.replace(/[\s\-]+/g,' ')+' ').indexOf(s)>-1; }); }); }
function trimRe(s){ var t=String(s||'').trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[\s\-]+/g,'[\\s\\-]?'); return t?new RegExp('(^|[^a-z0-9])'+t+'([^a-z0-9]|$)','i'):null; }

  var mine=car.trims||[]; if(!mine.length) return false;
  if(detectTrim(title,car.make).some(function(k){return mine.indexOf(k)>-1})) return true;
  if(car.trimCustom){ var re=trimRe(car.trimCustom); return !!(re&&re.test(String(title||''))); }

function trimPremium(list){ return list.some(function(k){ return MT_FLAG[k]===1||TRIMS.some(function(x){return x[0]===k&&x[2]}); }); }

/* ---------- OCR (runs in the browser, nothing is uploaded) ---------- */
var ocrLoad=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(ocrLoad) return ocrLoad;
  ocrLoad=new Promise(function(res,rej){
    var s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.crossOrigin='anonymous';
    s.onload=function(){res(window.Tesseract)}; s.onerror=function(){ocrLoad=null;rej(new Error('ocr_load'))}; document.head.appendChild(s);
  });
  return ocrLoad;
}
async function ocrImages(files,onProgress){
  var T=await loadTesseract(), out=[], i;
  for(i=0;i<files.length;i++){
    var r=await T.recognize(files[i],'eng+rus',{logger:function(m){ if(m&&m.status==='recognizing text'&&onProgress) onProgress(i,files.length,m.progress); }});
    out.push(r&&r.data&&r.data.text?r.data.text:'');
  }
  return out.join('\n');
}

/* Photos of the listing are read through the server's image proxy (the sites do not allow direct reading by the page). */
var PHOTO_TRIMS=['amg-line','amg','r-line','m-sport','s-line','st-line','monte carlo','black edition','sportline','l&k','avantgarde'];
function detectTrimPhoto(text){ return detectTrim(text).filter(function(k){return PHOTO_TRIMS.indexOf(k)>-1}); }
async function scanPhotos(urls,onProgress,cancelled){
  var T=await loadTesseract(), w=await T.createWorker('eng'), res=[], i;
  try{
    for(i=0;i<urls.length;i++){
      if(cancelled()) break;
      onProgress(i,urls.length);
      var txt='';
      try{ var r=await w.recognize(S.api+'/api/img?url='+encodeURIComponent(urls[i])); txt=(r&&r.data&&r.data.text)||''; }catch(e){ txt=''; }
      var trims=detectTrimPhoto(txt), vm=null, up=txt.toUpperCase().replace(/[IOQ]/g,function(c){return c==='I'?'1':'0'}), vv;
      var re=/\b([A-HJ-NPR-Z0-9]{17})\b/g; while((vv=re.exec(up))){ if((vv[1].match(/\d/g)||[]).length>=5&&(vv[1].match(/[A-Z]/g)||[]).length>=4){ vm=vv[1]; break; } }
      res.push({i:i,trims:trims,vin:vm,len:txt.length});
      if(trims.length) break;
    }
  } finally { try{ await w.terminate(); }catch(e){} }
  return res;
}

/* ---------- API ---------- */
async function api(path,params,ms){
  if(!S.api) return {ok:false,error:'no_api'};
  var qs=Object.keys(params||{}).filter(function(k){return params[k]!=null&&params[k]!==''}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  var ctl=new AbortController(), to=setTimeout(function(){ctl.abort()},ms||40000);
  try{
    var r=await fetch(S.api+path+(qs?'?'+qs:''),{signal:ctl.signal});
    var j=await r.json(); return j;
  }catch(e){ return {ok:false,error:'network',message:String(e&&e.message||e)}; }
  finally{ clearTimeout(to); }
}
function normApi(u){u=String(u||'').trim().replace(/\/+$/,''); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u}
function errText(j){
  var e=j&&j.error;
  if(e==='blocked') return L('сайт не отдал страницу серверу','the site refused the server');
  if(e==='filters_ignored') return L('сайт проигнорировал фильтры модели и года, результаты не годятся','the site ignored the model and year filters, the results are not usable');
  if(e==='not_found') return L('не найдено','not found');
  if(e==='parse_failed') return L('страница загрузилась, но объявления не распознаны','page loaded but ads were not recognised');
  if(e==='network') return L('сервер недоступен. Обновите страницу (Ctrl+F5), отключите блокировщик рекламы для этого сайта или проверьте интернет','server unreachable. Reload the page (Ctrl+F5), turn off ad blockers for this site or check the internet connection');
  if(e==='no_api') return L('сервер не подключён','server not connected');
  if(e==='need_model') return L('нужны марка и модель','make and model needed');
  return (j&&j.message)||L('ошибка','error');
}

async function run(){

    }

/* ---------- analysis ---------- */
function median(a){var s=a.slice().sort(function(x,y){return x-y}),n=s.length; return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):null}

  var rows=(items||[]).filter(function(i){return i&&i.price>=300&&i.price<=500000}), tol, sel=rows;
  for(tol=1;tol<=3;tol++){
    sel=rows.filter(function(i){return !car.year||i.year==null||Math.abs(i.year-car.year)<=tol});

  }
  if(car.fuel){ var same=sel.filter(function(i){return !i.fuel||(i.fuel==='lpg'?'petrol':i.fuel)===car.fuel}); if(same.length>=5) sel=same; }

  } else if(car.trimKnownText&&sel.length){
    var plain=sel.filter(function(i){return !trimPremium(detectTrim(i.title,car.make))});
    if(plain.length>=6&&plain.length<sel.length){ sel=plain; trimNote={mode:'plain',n:plain.length}; }
  }
  return {items:sel,pre:pre,total:rows.length,tol:tol>3?3:tol,trimNote:trimNote};
}
function fairOf(st){

}

    if(j.ok){

      row.pre=pr.pre; row.items=pr.items; row.total=pr.total; row.n=pr.items.length; row.tol=pr.tol; row.trimNote=pr.trimNote;
      row.stats=compStats(pr.items.map(function(i){return {price:i.price,km:i.km}}),{km:car.km});

        var smp=row.items.slice(0,3).map(function(i){return (i.title?String(i.title).slice(0,40)+' ':'')+(i.year?i.year+' ':'')+eur(i.price)}).join('; ');

        row.err=L('Не учитывается: сайт нашёл '+seenN+' объявл. с типичной ценой '+eur(seenMid)+', это в '+ratio.toFixed(1).replace('.',',')+' раза '+(seenMid>car.price?'выше':'ниже')+' вашей (возможно, показана другая модель, версия или другое топливо). Примеры: '+smp+'. Нажмите «Открыть» и проверьте вручную.','Ignored: the site found '+seenN+' ads with a typical price of '+eur(seenMid)+', '+ratio.toFixed(1)+'× '+(seenMid>car.price?'above':'below')+' yours (it may be another model, version or fuel). Examples: '+smp+'. Press “Open” and check manually.');

/* ---------- bargaining plan, risks/pluses, checklists, seller message, history links, bug report ---------- */
function r100(n){ return Math.round(n/100)*100; }
function planOf(v){
  var P=v.car.price, F=v.fair; if(!(P>0)||!F) return null;
  var offer, max=Math.min(P,r100(F.mid*1.03)), below=P<F.low;
  if(below){ offer=r100(P*0.97); max=P; }
  else if(P>F.mid) offer=Math.max(F.low,r100(F.mid*0.96));
  else offer=Math.max(F.low,r100(P*0.96));
  offer=Math.min(offer,max,P);
  return {ask:P,offer:offer,max:max,mid:F.mid,below:below};
}
function secPlan(v){
  var p=planOf(v); if(!p) return '';
  var card=function(label,val,sub){ return '<div class="cbox"><h4>'+esc(label)+'</h4><div class="ctotal"><b>'+esc(eur(val))+'</b></div>'+(sub?'<p class="mini">'+esc(sub)+'</p>':'')+'</div>'; };
  var note=p.below?L('Цена уже ниже рынка: торг почти не нужен, главное проверить историю и состояние.','The price is already below the market: little to negotiate, check the history and condition instead.')
    :p.ask<=p.max?L('Цена в пределах рынка: можно просить небольшую скидку.','The price is within the market: you can ask for a small discount.')
    :L('Цена выше рынка: есть запас для торга.','The price is above the market: there is room to negotiate.');
  return '<section class="sec" id="sec-plan"><h3 class="sh">'+esc(L('План торга','Negotiation plan'))+'</h3><div class="calc" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
    card(L('В объявлении','Asking'),p.ask,L('Справедливая цена по рынку: ','Market fair price: ')+eur(p.mid))+
    card(L('Предложите','Offer'),p.offer,L('С чего начать разговор','Where to start'))+
    card(L('Максимум','Maximum'),p.max,L('Выше платить невыгодно','Paying more is not worth it'))+'</div>'+
    '<p class="hint" style="margin-top:10px">'+esc(note)+'</p>'+
    '<div class="crow" style="margin-top:12px"><label for="k-what">'+esc(L('Если продавец согласится на цену, €','If the seller agrees to a price, €'))+'</label><input class="in num" id="k-what" type="text" inputmode="numeric" placeholder="'+esc(String(p.offer))+'"></div>'+
    '<p class="cdiff" id="k-what-out" style="margin-top:8px"></p></section>';
}
function updateWhat(){
  var el=document.getElementById('k-what'), out=document.getElementById('k-what-out'); if(!el||!out||!S.view) return;
  var w=parseInt((el.value||'').replace(/[^\d]/g,''),10), v=S.view, P=v.car.price, F=v.fair;
  if(!w){ out.textContent=''; return; }
  var parts=[];
  if(P>0){ var d=P-w; parts.push(d>0?L('Дешевле объявления на ','Below the ad by ')+eur(d)+' ('+(d/P*100).toFixed(1).replace('.',',')+'%)':d<0?L('Дороже объявления на ','Above the ad by ')+eur(-d):L('Как в объявлении','Same as the ad')); }
  if(F){ var vd=verdictOf(w,F.mid); parts.push(L('к рынку: ','vs market: ')+pct(vd.delta)+' — '+VNAME[vd.key][S.lang==='ru'?0:1]); }
  out.textContent=parts.join(' · ');

function flagsOf(v){
  var c=v.car, risks=[], pros=[], now=new Date().getFullYear(), age=c.year?now-c.year:null, tx=String(c.allText||'');
  var has=function(re){ return re.test(tx); }, add=function(a,ru,en){ a.push(L(ru,en)); };
  /* mileage */
  if(v.medKm!=null&&c.km!=null){ var dk=(c.km-v.medKm)/Math.max(1,v.medKm)*100;
    if(dk>15) add(risks,'Пробег выше медианы аналогов на '+Math.round(dk)+'%','Mileage is '+Math.round(dk)+'% above the comparables median');
    else if(dk<-15) add(pros,'Пробег ниже медианы аналогов на '+Math.round(-dk)+'%','Mileage is '+Math.round(-dk)+'% below the comparables median'); }
  if(age>=2&&c.km!=null){ var py=c.km/age;
    if(py>25000) add(risks,'Много для своего года: около '+Math.round(py/1000)+' тыс. км в год','High for its age: about '+Math.round(py/1000)+' thousand km per year');
    else if(age>=5&&py<8000) add(pros,'Небольшой пробег для возраста (около '+Math.round(py/1000)+' тыс. км в год); подтвердите историей техосмотров','Low mileage for its age (about '+Math.round(py/1000)+' thousand km per year); confirm with the inspection history'); }
  /* price */
  if(v.ver&&v.ver.delta!=null&&v.fair){
    if(v.ver.key==='high'||v.ver.key==='overpriced') add(risks,'Цена выше рынка на '+Math.round(v.ver.delta)+'%, есть запас для торга','The price is '+Math.round(v.ver.delta)+'% above the market, there is room to negotiate');
    else if(v.ver.key==='too_cheap') add(risks,'Цена сильно ниже рынка: проверьте историю, пробег и документы','The price is far below the market: check the history, mileage and papers');
    else if(v.ver.key==='good') add(pros,'Цена ниже рынка на '+Math.round(-v.ver.delta)+'%','The price is '+Math.round(-v.ver.delta)+'% below the market'); }
  /* age, fuel, gearbox (general checks, not claims about this car) */
  var ev=isEvCar(c);
  if(ev){
    add(risks,'Электромобиль: главный фактор цены и риска — состояние тяговой батареи. Попросите отчёт о состоянии батареи и реальный запас хода при полной зарядке','Electric car: the key factor for price and risk is the traction battery. Ask for a battery health report and the real range at a full charge');
    if(age!=null&&age>=7) add(risks,'Возраст '+age+' лет: гарантия на батарею у многих производителей около 8 лет, уточните остаток по сроку и пробегу','Age '+age+' years: many makers give about 8 years of battery warranty, ask what remains by age and mileage');
  }
  if(age!=null&&age>=12) add(risks,'Возраст '+age+' лет: проверьте кузов на коррозию, подвеску и резиновые детали','Age '+age+' years: check the body for rust, the suspension and rubber parts');
  if(c.lpg) add(risks,'Газовое оборудование: проверьте оформление в документах, срок баллона и работу ГБО','Gas equipment: check the registration, the cylinder expiry and the system');
  if(c.fuel==='diesel'&&!ev&&((c.km||0)>180000||(age||0)>=9)) add(risks,'Дизель с большим пробегом или возрастом: проверьте сажевый фильтр, EGR и форсунки','Diesel with high mileage or age: check the particulate filter, EGR and injectors');
  if(!ev&&c.gear==='automatic'&&(c.km||0)>150000) add(risks,'Автомат с большим пробегом: узнайте, когда меняли масло в коробке','Automatic with high mileage: ask when the gearbox oil was changed');
  /* VIN */

$('#btn-clear').addEventListener('click',function(){
  $('#intake').reset(); S.images.forEach(function(i){URL.revokeObjectURL(i.url)}); S.images=[]; renderThumbs(); S.view=null; S.srcRows={}; renderSrcs(); render(); showStatus(''); renderHints(); renderVinLive();
});
$('#lang-ru').addEventListener('click',function(){S.lang='ru';LS.set(KEY_LANG,'ru');applyLang()});
$('#lang-en').addEventListener('click',function(){S.lang='en';LS.set(KEY_LANG,'en');applyLang()});
$('#btn-cfg').addEventListener('click',function(){var p=$('#cfg'); p.hidden=!p.hidden; this.setAttribute('aria-expanded',p.hidden?'false':'true'); if(!p.hidden) $('#f-api').focus();});
$('#btn-api-save').addEventListener('click',function(){S.api=normApi($('#f-api').value); $('#f-api').value=S.api; LS.set(KEY_API,S.api); if(!S.api){ $('#cfg-msg').textContent=L('Адрес очищен.','Address cleared.'); apiDot('none'); return; } testApi();});

/* ---------- boot ---------- */
(function init(){
  var l=LS.get(KEY_LANG); S.lang=(l==='en'||l==='ru')?l:((navigator.language||'').toLowerCase().indexOf('ru')===0?'ru':'en');
  S.api=normApi(LS.get(KEY_API)||API_DEFAULT); $('#f-api').value=S.api; S.apiOk=null;
  applyLang(); apiDot('none');
  if(S.api||API_DEFAULT){ connect(); } else { $('#cfg').hidden=false; $('#btn-cfg').setAttribute('aria-expanded','true'); }
  /* ---------- install as an app (PWA) ---------- */
(function(){
  var deferred=null, btn=$('#btn-install');
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(btn&&!standalone) btn.hidden=false; });
  window.addEventListener('appinstalled',function(){ deferred=null; if(btn) btn.hidden=true; showStatus('ok',L('Приложение установлено.','App installed.')); });
  if(ios&&!standalone&&btn) btn.hidden=false;
  if(btn) btn.addEventListener('click',function(){
    if(deferred){ deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; btn.hidden=true; }); }
    else if(ios) showStatus('info',L('На iPhone: нажмите «Поделиться» в Safari и выберите «На экран “Домой”».','On iPhone: tap “Share” in Safari and choose “Add to Home Screen”.'));
    else showStatus('info',L('Откройте меню браузера (три точки) и выберите «Установить приложение» или «Добавить на главный экран».','Open the browser menu (three dots) and choose “Install app” or “Add to Home screen”.'));
  });
})();
window.__carscout={S:S,run:run,compute:compute,parseText:parseText,pickRelevant:pickRelevant};
})();
})();
</script>
</body>
</html>
