<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CarScout">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>CarScout Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* CarScout · theme A "analyst terminal" (built on the B structure) "editorial report": light paper, serif headlines, hairline rules, numbered sections,
   one signal colour (orange) for "your car" on every chart, navy for market data. */
:root{
  color-scheme:dark;
  --bg:#07090C; --paper:#0F1318; --surface:#0F1318; --surface-2:#151A21; --field:#0B0E12;
  --ink:#E9ECF0; --ink2:#C3C9D2; --muted:#8A94A3; --dim:#5A6472; --line:#1C222A; --line2:#29303A;
  --accent:#C6F24E; --accent-fg:#0B0E12; --accent-soft:rgba(198,242,78,.12);
  --navy:#7AA7FF; --navy-2:#3E5C8F; --navy-soft:rgba(122,167,255,.13); --series2:#7AA7FF;
  --info:#7AA7FF; --info-soft:rgba(122,167,255,.13); --good:#3DD68C; --good-soft:rgba(61,214,140,.12); --warn:#F2B544; --warn-soft:rgba(242,181,68,.12);
  --bad:#F2686A; --bad-soft:rgba(242,104,106,.12); --sus:#B79CFF; --sus-soft:rgba(183,156,255,.13);
  --bar:#2A3443;--gz1:#3A3150;--gz2:#1F4A36;--gz3:#2A313B;--gz4:#5A4620;--gz5:#5E2A2B;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-serif:'Inter Tight','Inter',system-ui,sans-serif;
  --f-mono:'Inter',system-ui,sans-serif;
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:#cfcabe transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);font-feature-settings:'tnum';-webkit-font-smoothing:antialiased;padding:0 0 56px}
h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft)}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.2) blur(8px);-webkit-backdrop-filter:saturate(1.2) blur(8px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:22px;min-width:0}
.plate{display:inline-flex;align-items:center;gap:10px;font:600 21px/1 var(--f-serif);letter-spacing:-.01em;color:var(--ink);flex:none}
.plate .eu{display:none}
.plate .pt{font:inherit;letter-spacing:inherit;padding:0;text-transform:none}
.plate::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.brand .sub{color:var(--muted);font-size:13.5px;min-width:0;padding-left:22px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none;background:var(--paper)}
.seg button{font-weight:600;font-size:12.5px;padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#cfg-dot{font-size:12px}

/* ---------- intro ---------- */
.lead{padding:52px 0 30px;max-width:900px}
.lead::before{content:"CarScout · " attr(data-over);display:flex;align-items:center;gap:14px;font:500 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.lead h1{font:500 clamp(34px,5.6vw,60px)/1.04 var(--f-serif);letter-spacing:-.025em;text-wrap:balance;margin-bottom:16px}
.lead p{font:400 clamp(16px,1.9vw,20px)/1.5 var(--f-serif);color:var(--ink2);max-width:62ch}

/* ---------- layout ---------- */
.grid{display:flex;flex-direction:column;gap:28px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;min-width:0}
.intake{padding:26px 28px;display:grid;gap:18px 28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  #intake{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  #intake>*{grid-column:1/-1}
  #intake>#shots-fld{grid-column:1}
  #intake>#shots-fld+.fld{grid-column:2}
  #intake>#manual{grid-column:1}
  #intake>#extra-d{grid-column:2}
  #intake>.btns{grid-column:1/-1}
}
#out{display:flex;flex-direction:column;min-width:0;counter-reset:sec}
#out:empty{display:none}

/* ---------- report sections: number + serif title on the left, content card on the right ---------- */
.sec{display:grid;grid-template-columns:240px minmax(0,1fr);column-gap:44px;padding:38px 0;border-top:1px solid var(--line);min-width:0}
.sec>.sh,.sec>.vhead{grid-column:1;align-self:start;margin:0;position:sticky;top:84px}
.sbody{grid-column:2;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.sbody>*{margin:0!important;min-width:0}
.sh{font:500 27px/1.16 var(--f-serif);letter-spacing:-.015em;color:var(--ink);text-transform:none;text-wrap:balance}
.sh::before{counter-increment:sec;content:counter(sec,decimal-leading-zero);display:block;font:500 13px var(--f-body);letter-spacing:.08em;color:var(--accent);margin-bottom:10px}
@media (max-width:899px){
  .sec{grid-template-columns:minmax(0,1fr);padding:30px 0}
  .sec>.sh,.sec>.vhead{position:static;margin:0 0 16px}
  .sbody{grid-column:1;padding:18px}
  .sh{font-size:24px}
}
.vhead{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.vmain .vplate{display:none}
@media (max-width:899px){
  .sec{grid-template-columns:minmax(0,1fr);padding:30px 0}
  .sec>*{grid-column:1;margin-inline:18px}
  .sec>.sh,.sec>.vhead{grid-column:1;grid-row:auto;position:static;margin:0 0 16px}
  .sec::after{grid-column:1;grid-row:2/span 40}
  .sec>.sh+*,.sec>.vhead+*{margin-top:20px}
  .sec>:last-child{margin-bottom:20px}
  .sh{font-size:24px}
}

/* ---------- report hero ---------- */
.rep{padding:44px 0 0}
.rep .over{display:flex;align-items:center;gap:14px;font:500 12px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.rep .over::before{content:"";width:28px;height:1px;background:var(--ink)}
.rep-g{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;align-items:end;padding-bottom:34px;border-bottom:1px solid var(--ink)}
.rep h2{font:500 clamp(36px,5.4vw,64px)/1.02 var(--f-serif);letter-spacing:-.025em;margin-top:16px;text-wrap:balance}
.rep h2 em{font-style:italic;font-weight:400;color:var(--muted)}
.rep .lede{font:400 clamp(17px,1.9vw,22px)/1.45 var(--f-serif);color:var(--ink2);margin-top:20px;max-width:62ch}
.rep .lede b{font-weight:600;color:var(--ink)}
.rep .lede .o{color:var(--accent);font-weight:600}
.rep .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.tg{font-size:12.5px;border:1px solid var(--line2);border-radius:999px;padding:4px 12px;background:var(--paper);color:var(--ink2);white-space:nowrap}
.tg.o{border-color:var(--accent);color:var(--accent)}
.tg.g{border-color:#CFE3D6;background:var(--good-soft);color:var(--good)}
.tg.w{border-color:#EAD6B3;background:var(--warn-soft);color:var(--warn)}
.tg.b{border-color:#EBC5BE;background:var(--bad-soft);color:var(--bad)}
.tg.s{border-color:#D9CDEC;background:var(--sus-soft);color:var(--sus)}
.gcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.gtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gnum{font:500 52px/1 var(--f-serif);letter-spacing:-.02em}.gnum small{font-size:22px;color:var(--muted)}
.glab{font-size:13px;color:var(--muted);margin-top:6px}
.gcard svg{display:block;width:100%;height:auto;margin-top:10px}
.glg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11.5px;color:var(--muted);margin-top:12px}.glg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gdl{text-align:center;font-weight:600;font-size:13px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-bottom:1px solid var(--line);margin-bottom:6px}
.fct{padding:18px 0 18px 18px;border-left:1px solid var(--line);min-width:0}.fct:first-child{border-left:0;padding-left:0}
.fct dt{font-size:12px;color:var(--muted)}.fct dd{font:500 22px/1.2 var(--f-serif);margin-top:6px;letter-spacing:-.01em;overflow-wrap:anywhere}.fct small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:1100px){.rep-g{grid-template-columns:minmax(0,1fr)}.gcard{max-width:520px}.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.fct:nth-child(4){border-left:0;padding-left:0}.fct{border-top:1px solid var(--line)}.fct:nth-child(-n+3){border-top:0}}
@media (max-width:560px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fct:nth-child(n){border-left:0;padding-left:0;border-top:1px solid var(--line)}.fct:nth-child(even){border-left:1px solid var(--line);padding-left:14px}.fct:nth-child(-n+2){border-top:0}.rep{padding-top:28px}.gnum{font-size:44px}}

/* ---------- form ---------- */
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld label,.fld .lbl{font-weight:600;font-size:13px;color:var(--ink)}
.in{background:var(--field);border:1px solid var(--line2);border-radius:var(--r-sm);padding:11px 13px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.in:hover{border-color:#bdb7aa}
.in:focus-visible{outline:0;border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,23,27,.08)}
.in.lg{padding:15px 18px;font-size:16px;border-radius:999px}
select.in option{background:#fff;color:var(--ink)}
textarea.in{resize:vertical;min-height:84px}
.mono{font-family:var(--f-body);letter-spacing:.08em}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--line2);border-radius:var(--r);padding:16px 12px;color:var(--muted);cursor:pointer;background:var(--bg);min-height:84px;font-size:14px}
.drop:hover,.drop.over{border-color:var(--ink);color:var(--ink)}
.drop:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.drop.pulse{border-color:var(--accent);color:var(--ink);animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.drop.pulse{animation:none}}
.needshot{margin-top:10px;padding:12px 14px;border:1px solid #EAD6B3;background:var(--warn-soft);border-radius:var(--r);display:grid;gap:8px}
.needshot[hidden]{display:none}
.needshot .ns-t{margin:0;font-weight:600;color:var(--ink);font-size:14px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
details.imp{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg)}
details.imp summary{cursor:pointer;font-weight:600;font-size:14px}
details.imp[open] summary{margin-bottom:12px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);cursor:pointer;padding-block:4px}
.chk input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--ink)}
.chk.done span{color:var(--muted);text-decoration:line-through}

/* ---------- buttons, chips ---------- */
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-weight:600;font-size:14px;border-radius:999px;padding:10px 18px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;min-height:44px;transition:background .15s,color .15s,transform .15s}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;flex:0 1 auto;padding-inline:26px}
.btn.pri:hover:not(:disabled){background:#2c2f36}
.btn.sm{padding:5px 14px;min-height:34px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#btn-go{min-width:240px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:3px 11px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;background:var(--paper);color:var(--ink2)}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--ink)}
.chip.warn{border-color:#EAD6B3;color:var(--warn);background:var(--warn-soft)}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink2);border:1px solid var(--line)}
.pill.low{background:var(--warn-soft);color:var(--warn);border-color:#EAD6B3}
.pill.high{background:var(--good-soft);color:var(--good);border-color:#CFE3D6}
.pill.medium{background:var(--info-soft);color:var(--info);border-color:#CBD6E8}

/* ---------- status ---------- */
.st{border-radius:var(--r);padding:11px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line)}
.st.busy{background:var(--bg)}
.st.err{background:var(--bad-soft);color:var(--bad);border-color:#EBC5BE}
.st.ok{background:var(--good-soft);color:var(--good);border-color:#CFE3D6}
.st.info{background:var(--bg);color:var(--ink2)}
.ind{height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative;margin-top:8px;flex-basis:100%}
.ind::after{content:"";position:absolute;inset:0 auto 0 -35%;width:35%;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{to{left:100%}}
@media (prefers-reduced-motion:reduce){.ind::after{animation:none;left:0;width:100%;opacity:.5}}
.srcs{display:flex;flex-direction:column;gap:0}
.src{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:13.5px;padding:9px 0;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src .sn{font-weight:600;min-width:140px}
.src .ss{color:var(--muted);font-size:12.5px;flex:1 1 160px}
.src.ok .ss{color:var(--good)} .src.err .ss{color:var(--warn)} .src.run .ss{color:var(--accent)}
.src a{color:var(--ink);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px}

/* ---------- profile ---------- */
.demo{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.prof{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.pthumb{width:240px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.pmain{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pmain h2{font:500 clamp(24px,3.4vw,32px)/1.1 var(--f-serif);letter-spacing:-.015em;text-wrap:balance}
.price{font:500 clamp(28px,4vw,38px)/1.1 var(--f-serif);color:var(--ink);letter-spacing:-.02em}
.sub{color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 22px;padding-top:14px;border-top:1px solid var(--line)}
.kv div{min-width:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{font-weight:600;overflow-wrap:anywhere;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{border:1px solid #EAD6B3;background:var(--warn-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.banner b{font-weight:600}
.mini{font-size:12px;color:var(--muted)}
textarea.in.sm{min-height:64px;font-size:13.5px}

/* ---------- verdict ---------- */
.vmain{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-bottom:18px}
.vtext{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}
.headline{font:500 19px/1.35 var(--f-serif)}
.sumbox{display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--accent);padding:2px 0 2px 18px;margin-bottom:20px}
.sumbox p{font:400 16.5px/1.55 var(--f-serif);color:var(--ink2)}
.sumbox .lv{color:var(--muted);font:400 14px/1.5 var(--f-body)}
.lvtag{display:inline-block;font:600 10.5px var(--f-body);border:1px solid var(--line2);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--ink)}
.dots{display:flex;flex-direction:column}
.dots li{position:relative;padding:9px 0 9px 18px;font-size:14px;line-height:1.5;border-top:1px solid var(--line)}
.dots li:first-child{border-top:0}
.dots li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.dots.bad li::before{background:var(--bad)}
.dots.good li::before{background:var(--good)}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;color:var(--muted)}

/* ---------- price ruler ---------- */
.ruler{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.rlegend{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.askkey{display:inline-block;width:0;height:16px;border-left:2px solid var(--accent)}
.rrow{display:flex;flex-direction:column;gap:6px}
.rlab{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px}
.rrange{position:absolute;top:0;bottom:0;min-width:4px;border-radius:5px;background:var(--navy)}
.rrange.cp{background:var(--navy-2)}
.rwhisk{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--dim)}
.rmid{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--ink)}
.askmark{position:absolute;top:-8px;bottom:-8px;width:0;border-left:2px solid var(--accent)}
.rnum{font-size:13px}
.rnum span{color:var(--muted)}

/* ---------- generic blocks ---------- */
.vin{display:flex;flex-wrap:wrap;gap:8px 6px}
.vg{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.vg b{font:500 16px var(--f-body);letter-spacing:.1em;border:1px solid var(--line2);background:var(--bg);padding:4px 7px;border-radius:6px}
.vg small{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ok{color:var(--good)} .wn{color:var(--warn)} .bd{color:var(--bad)} .ok-b{color:var(--good)}
.two{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.two h4,.sub-h{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat span{font-size:12px;color:var(--muted)}
.stat b{font:500 21px/1.2 var(--f-serif);overflow-wrap:anywhere}
.alt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding-block:10px;border-top:1px solid var(--line)}
.alt:first-of-type{border-top:0}
.ins{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.ib{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.ib.wide{grid-column:1/-1}
.ib .v{font:500 20px/1.2 var(--f-serif)}

/* ---------- regions ---------- */
.bars{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.brow{display:grid;grid-template-columns:minmax(92px,160px) minmax(0,1fr) auto;gap:14px;align-items:center;font-size:13.5px}
.brow .bt{height:20px;border-radius:2px;background:var(--surface-2);position:relative;overflow:hidden}
.brow .bt i{position:absolute;inset:0 auto 0 0;border-radius:2px;background:var(--navy)}
.brow.me .bt i{background:var(--accent)}
.brow .bv{font-weight:600;text-align:right;white-space:nowrap}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:0 10px 10px 0;border-bottom:1px solid var(--ink);white-space:nowrap;font-weight:500}
.tbl td{padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl .rn{font-size:12.5px;color:var(--muted);max-width:40ch}
.tbl tr.me td{font-weight:600}
.tbl tr.me td:first-child{color:var(--accent)}
.dpos{color:var(--bad)} .dneg{color:var(--good)}
.sbtn{display:inline-flex;padding:4px 12px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap;background:var(--paper)}
.sbtn:hover{background:var(--surface-2)}
.sbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- charts ---------- */
.chart{margin-block:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:#ECE8E0;stroke-width:1}
.chart .tx{fill:var(--muted);font:11px var(--f-body)}
.chart .band{fill:var(--navy-soft)}
.chart .pt{fill:var(--navy);fill-opacity:.82}
.chart .fit{stroke:var(--navy);stroke-width:1.5}
.chart .me{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .halo{fill:var(--accent);fill-opacity:.18}
.chart .tip{fill:#fff;stroke:var(--line2)}
.chart .tt{fill:var(--muted);font:11px var(--f-body)}
.chart .tv{fill:var(--ink);font:600 12px var(--f-body)}
.chart .area{fill:var(--accent-soft)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.chart .dot{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .vl{fill:var(--ink);font:600 11.5px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);align-items:center;margin-top:6px}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--navy);margin-right:7px}
.sw.me{background:var(--accent);border-radius:50%;transform:none}
.sw.bd{background:var(--navy-soft);border-radius:2px}
.cap{font-size:12px;color:var(--muted)}

/* ---------- plan, calculator, cards ---------- */
.calc{display:grid;gap:0;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cbox{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-left:1px solid var(--line);min-width:0}
.cbox:first-child{border-left:0}
.cbox h4{font:500 13px var(--f-body);color:var(--muted)}
#sec-calc .calc,#sec-flags .calc,#sec-checks .calc{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13.5px}
.crow .in{padding:8px 10px;text-align:right;border-radius:8px}
.ctotal{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ctotal b{font:500 32px/1 var(--f-serif);color:var(--ink);letter-spacing:-.02em}
#sec-plan .cbox:nth-child(2) .ctotal b{color:var(--good)}
.cdiff{font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a,.res a{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid var(--line2);border-radius:999px;color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none;background:var(--paper)}
.links a:hover,.res a:hover{border-color:var(--ink)}
.links a:focus-visible,.res a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res li{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line);font-size:14px}
.res li:first-child{border-top:0}
.sl{display:flex;flex-direction:column}
.sl li{display:flex;gap:8px;align-items:stretch;border-top:1px solid var(--line)}
.sl li:first-child{border-top:0}
.sl .open{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:10px 4px;cursor:pointer;display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:space-between;align-items:center}
.sl .open:hover{background:var(--bg)}
.sl .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sl .m{font-size:12.5px;color:var(--muted)}
.lcards{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lc{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0;border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;background:var(--paper)}
.lc .lp{font:500 24px/1 var(--f-serif);letter-spacing:-.02em}
.lc .ld{font-size:12.5px;font-weight:600}
.lc .lm{font-size:13px;color:var(--muted)}
.lc a{margin-top:auto;color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
#sec-msg textarea{font:italic 400 16px/1.55 var(--f-serif);color:var(--ink2);border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px;background:var(--bg)}
#favs{margin-top:8px}
#favs.sec{display:block;padding:24px 26px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
#favs .sh{font-size:22px}
#favs .sh::before{content:"★";counter-increment:none;color:var(--accent);font-size:14px}
#favs table.tbl td{padding-right:14px}

/* ---------- footer ---------- */
.foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);max-width:none;display:flex;flex-direction:column;gap:10px}
.foot .btn{margin-left:8px}

[hidden]{display:none!important}
.cfg{display:flex;flex-direction:column;gap:10px}
#btn-install{white-space:nowrap}

/* radar */
.fz-radar{display:block;width:100%;height:auto;overflow:visible}
.fz-disc{fill:url(#fzg)}
.fz-ring{fill:none;stroke:color-mix(in srgb,var(--accent) 24%,transparent);stroke-width:1}

.fz-ghost{fill:var(--accent);opacity:0;animation:fzghost 3.6s ease-out infinite backwards}
@keyframes fzspin{to{transform:rotate(360deg)}}
@keyframes fzblip{0%{opacity:1;r:5.2px}14%{opacity:.95}100%{opacity:.3}}

/* my searches */
.fz-empty{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center;padding:4px 0 6px}

.fz-top{display:grid;grid-template-columns:170px minmax(0,1fr);gap:22px;align-items:center;margin-bottom:12px}
.fz-sum{display:grid;gap:3px}

@media (max-width:560px){

.fz-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.fz-res:not(.all) .fz-row.more{display:none}
.fz-th{display:block;width:72px;height:52px;border-radius:8px;overflow:hidden;background:var(--surface-2,rgba(255,255,255,.04))}

.fz-ri{display:grid;gap:3px;min-width:0}

async function scanPhotos(urls,onProgress,cancelled){
  var T=await loadTesseract(), w=await T.createWorker('eng'), res=[], i;

    for(i=0;i<urls.length;i++){
      if(cancelled()) break;
      onProgress(i,urls.length);
      var txt='';

      var re=/\b([A-HJ-NPR-Z0-9]{17})\b/g; while((vv=re.exec(up))){ if((vv[1].match(/\d/g)||[]).length>=5&&(vv[1].match(/[A-Z]/g)||[]).length>=4){ vm=vv[1]; break; } }

/* ---------- API ---------- */
async function api(path,params,ms){
  if(!S.api) return {ok:false,error:'no_api'};
  var qs=Object.keys(params||{}).filter(function(k){return params[k]!=null&&params[k]!==''}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  var ctl=new AbortController(), to=setTimeout(function(){ctl.abort()},ms||40000);
  try{
    var r=await fetch(S.api+path+(qs?'?'+qs:''),{signal:ctl.signal});
    var j=await r.json(); return j;
  }catch(e){ return {ok:false,error:'network',message:String(e&&e.message||e)}; }
  finally{ clearTimeout(to); }
}
function normApi(u){u=String(u||'').trim().replace(/\/+$/,''); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u}
function errText(j){
  var e=j&&j.error;

  if(e==='filters_ignored') return L('сайт проигнорировал фильтры модели и года, результаты не годятся','the site ignored the model and year filters, the results are not usable');

  if(e==='parse_failed') return L('страница загрузилась, но объявления не распознаны','page loaded but ads were not recognised');
  if(e==='network') return L('сервер недоступен. Обновите страницу (Ctrl+F5), отключите блокировщик рекламы для этого сайта или проверьте интернет','server unreachable. Reload the page (Ctrl+F5), turn off ad blockers for this site or check the internet connection');

    if(sel.length>=5) break;

/* ---------- bargaining plan, risks/pluses, checklists, seller message, history links, bug report ---------- */
function r100(n){ return Math.round(n/100)*100; }
function planOf(v){
  var P=v.car.price, F=v.fair; if(!(P>0)||!F) return null;
  var offer, max=Math.min(P,r100(F.mid*1.03)), below=P<F.low;
  if(below){ offer=r100(P*0.97); max=P; }
  else if(P>F.mid) offer=Math.max(Math.ceil(F.low/100)*100,r100(F.mid*0.96));
  else offer=Math.max(Math.ceil(F.low/100)*100,r100(P*0.96));
  offer=Math.min(offer,max,P);
  return {ask:P,offer:offer,max:max,mid:F.mid,below:below};
}

  return '<section class="sec" id="sec-plan"><h3 class="sh">'+esc(L('План торга','Negotiation plan'))+'</h3><div class="calc" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+
    card(L('В объявлении','Asking'),p.ask,L('Справедливая цена по рынку: ','Market fair price: ')+eur(p.mid))+
    card(L('Предложите','Offer'),p.offer,L('С чего начать разговор','Where to start'))+
    card(L('Максимум','Maximum'),p.max,L('Выше платить невыгодно','Paying more is not worth it'))+'</div>'+
    '<p class="hint" style="margin-top:10px">'+esc(note)+'</p>'+
    '<div class="crow" style="margin-top:12px"><label for="k-what">'+esc(L('Если продавец согласится на цену, €','If the seller agrees to a price, €'))+'</label><input class="in num" id="k-what" type="text" inputmode="numeric" placeholder="'+esc(String(p.offer))+'"></div>'+
    '<p class="cdiff" id="k-what-out" style="margin-top:8px"></p></section>';

function flagsOf(v){
  var c=v.car, risks=[], pros=[], now=new Date().getFullYear(), age=c.year?now-c.year:null, tx=String(c.allText||'');
  var has=function(re){ return re.test(tx); }, add=function(a,ru,en){ a.push(L(ru,en)); };
  /* mileage */
  if(v.medKm!=null&&c.km!=null){ var dk=(c.km-v.medKm)/Math.max(1,v.medKm)*100;
    if(dk>15) add(risks,'Пробег выше медианы аналогов на '+Math.round(dk)+'%','Mileage is '+Math.round(dk)+'% above the comparables median');
    else if(dk<-15) add(pros,'Пробег ниже медианы аналогов на '+Math.round(-dk)+'%','Mileage is '+Math.round(-dk)+'% below the comparables median'); }
  if(age>=2&&c.km!=null){ var py=c.km/age;
    if(py>25000) add(risks,'Много для своего года: около '+Math.round(py/1000)+' тыс. км в год','High for its age: about '+Math.round(py/1000)+' thousand km per year');
    else if(age>=5&&py<8000) add(pros,'Небольшой пробег для возраста (около '+Math.round(py/1000)+' тыс. км в год); подтвердите историей техосмотров','Low mileage for its age (about '+Math.round(py/1000)+' thousand km per year); confirm with the inspection history'); }
  /* price */
  if(v.ver&&v.ver.delta!=null&&v.fair){

/* ---------- app version, dealer ads, favourites + price watch, ownership cost, sharing ---------- */
var APP_VER = '2026-10-19.2', KEY_FAVS='carscout_favs';
/* Auto-update: on every start and every return to the app the published version is compared with the running one,
   and the page reloads into the new one by itself. It never reloads while a check is running or right after a tap;
   then (and after a short switch to another app) it shows a notice with an "Update" button instead. */
var UPD={entry:location.href,last:0,busy:false,touch:0,hiddenAt:0};
['touchstart','mousedown','keydown'].forEach(function(ev){ addEventListener(ev,function(){ UPD.touch=Date.now(); },{capture:true,passive:true}); });
function updNotice(n){
  if(S.busy){ if((n||0)<40) setTimeout(function(){ updNotice((n||0)+1); },3000); return; }   /* wait for the running check to end */
  var el=$('#status'); if(!el) return;
  el.innerHTML='<div class="st info"><span>'+esc(L('Вышла новая версия приложения.','A new version of the app is out.','Pieejama jauna lietotnes versija.'))+'</span><button class="btn sm" type="button" data-act="refresh">'+esc(L('Обновить','Update','Atjaunināt'))+'</button></div>';
}
function autoUpdate(resumed){
  if(!/^https?:$/.test(location.protocol)||UPD.busy||!window.fetch) return;
  var t0=Date.now(); if(t0-UPD.last<20000) return; UPD.last=t0; UPD.busy=true;
  var ac=window.AbortController?new AbortController():null, to=setTimeout(function(){ if(ac) ac.abort(); },8000);
  fetch(location.pathname+'?__upd=1',{cache:'no-cache',signal:ac?ac.signal:undefined}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
    var m=/APP_VER = '([^']+)'/.exec(t), live=m&&m[1]; if(!live||live===APP_VER) return;
    var tried=null; try{ tried=sessionStorage.getItem('carscout_upd'); }catch(e){}
    /* a start with no tap yet always reloads (a shared link that began a check on its own is started again after the reload);
       coming back from another app reloads only after a minute away and when no check is running */
    var calm=UPD.touch<t0&&(!resumed||(!S.busy&&t0-UPD.hiddenAt>=60000));
    if(!calm||tried===live){ updNotice(); return; }   /* already reloaded once for this version and still old: no loop */
    try{ sessionStorage.setItem('carscout_upd',live); }catch(e){}
    var u; try{ var x=new URL(UPD.entry); x.searchParams.set('r',String(Date.now())); u=x.href; }catch(e){ u=location.pathname+'?r='+Date.now(); }
    location.replace(u);   /* the same address (a shared link or "?find=1" from a notification stays), with a fresh stamp */
  }).catch(function(){}).then(function(){ clearTimeout(to); UPD.busy=false; });
}
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') UPD.hiddenAt=Date.now(); else autoUpdate(true); });
window.addEventListener('pageshow',function(e){ if(e.persisted) autoUpdate(true); });
function refreshApp(){
  showStatus('busy',function(){return L('Обновляю приложение…','Updating the app…')},false);
  var done=function(){ location.replace(location.pathname+'?r='+Date.now()); };
  var p=[];
  try{ if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ /* keep a worker that carries phone notifications: update it instead */ return (r.pushManager?r.pushManager.getSubscription():Promise.resolve(null)).then(function(sub){ return sub?r.update():r.unregister(); }).catch(function(){ return r.unregister(); }); })); })); }catch(e){}
  try{ if(window.caches&&caches.keys) p.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){return caches.delete(k)})); })); }catch(e){}
  Promise.all(p).then(done,done); setTimeout(done,2500);
}

function gaugeSvg(delta){
  var w=400, h=196, cx=w/2, cy=h-8, R=150, lo=-30, hi=30;
  var d=Math.max(lo,Math.min(hi,delta==null?0:delta));
  var a=function(v){return Math.PI*(1-(v-lo)/(hi-lo))}, P=function(v,r){return [cx+r*Math.cos(a(v)),cy-r*Math.sin(a(v))]};
  var arc=function(v0,v1,c){var p0=P(v0,R),p1=P(v1,R);return '<path d="M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+R+' '+R+' 0 0 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'" fill="none" style="stroke:'+c+'" stroke-width="16"/>'};
  var s='<svg viewBox="0 0 '+w+' '+(h+6)+'" role="img" aria-label="'+esc(L('Цена относительно рынка: ','Price vs market: ')+pct(delta))+'" font-family="Inter,sans-serif">';
  s+=arc(-30,-20.6,'var(--gz1)')+arc(-19.4,-8.6,'var(--gz2)')+arc(-7.4,7.4,'var(--gz3)')+arc(8.6,17.4,'var(--gz4)')+arc(18.6,30,'var(--gz5)');
  [-30,-20,-8,0,8,18,30].forEach(function(v){var p=P(v,R+22);s+='<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+4).toFixed(1)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+(v>0?'+':v<0?'−':'')+Math.abs(v)+'%</text>'});
  if(delta!=null){var n=P(d,R-10);s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0].toFixed(1)+'" y2="'+n[1].toFixed(1)+'" style="stroke:var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="'+n[0].toFixed(1)+'" cy="'+n[1].toFixed(1)+'" r="7" style="fill:var(--accent);stroke:var(--paper)" stroke-width="2.5"/>';}
  s+='<circle cx="'+cx+'" cy="'+cy+'" r="7" style="fill:var(--ink)"/>';
  return s+'</svg>';
}

function aVerdictText(v){
  var k=v.ver.key, d=v.ver.delta, c=v.car, t='';
  var pre=v.home&&v.home.region!=='LV'?L('По рынку '+rgen(v.home.region)+': ','By the '+rname(v.home.region)+' market: '):'';
  if(k==='fair') t=d>1?L('Цена внутри справедливого диапазона, немного выше середины.','The price is within the fair range, slightly above the midpoint.'):d<-1?L('Цена внутри справедливого диапазона, ниже середины.','The price is within the fair range, below the midpoint.'):L('Цена около середины рынка.','The price is close to the market midpoint.');
  else if(k==='good') t=L('Цена ниже рынка. Проверьте историю и состояние: выгодная цена бывает неспроста.','The price is below the market. Check the history and condition.');
  else if(k==='high') t=L('Цена выше рынка: есть запас для торга.','The price is above the market: there is room to negotiate.');
  else if(k==='overpriced') t=L('Цена сильно выше рынка. Торгуйтесь или ищите другие варианты.','The price is far above the market.');
  else if(k==='too_cheap') t=L('Подозрительно дёшево. Тщательно проверьте документы, пробег и историю.','Suspiciously cheap. Check the papers, mileage and history carefully.');

    a=a.filter(function(x){return x.id!==id}); a.unshift({id:id,url:c.url||'',title:[c.make,c.model,c.year].filter(Boolean).join(' '),price:c.price||null,km:c.km,verdict:v.ver?v.ver.key:null,delta:v.ver&&v.ver.delta!=null?Math.round(v.ver.delta*10)/10:null,at:Date.now()});
    LS.set(KEY_HIST,JSON.stringify(a.slice(0,15))); }catch(e){}
}

  var box=document.getElementById('hist');

function apiDot(state){ var d=$('#cfg-dot'); d.style.color=state==='ok'?'var(--good)':state==='bad'?'var(--bad)':'var(--muted)'; S.apiState=state; var b=$('#btn-cfg'); if(b){ var t=state==='ok'?L('Сервер подключён','Server connected','Serveris pieslēgts'):state==='bad'?L('Сервер недоступен','Server unreachable','Serveris nav sasniedzams'):L('Сервер','Server','Serveris'); b.title=t; b.setAttribute('aria-label',t); } }
async function connect(){
  var stored=normApi(LS.get(KEY_API)), def=normApi(API_DEFAULT), cands=[];
  if(def) cands.push(def); if(stored&&stored!==def) cands.push(stored);
  for(var i=0;i<cands.length;i++){
    S.api=cands[i]; var j=await api('/',{},9000);
    if(j&&j.ok){ apiDot('ok'); $('#f-api').value=S.api; if(stored!==S.api) LS.set(KEY_API,S.api); S.apiOk=true; return true; }
  }
  S.api=cands[0]||''; S.apiOk=false; apiDot(cands.length?'bad':'none'); return false;
}
async function testApi(){
  var msg=$('#cfg-msg'); msg.textContent=L('Проверяю…','Testing…');
  var j=await api('/',{},12000);
  if(j&&j.ok){ msg.textContent=L('Сервер работает: версия ','Server is working: version ')+(j.version||'?'); apiDot('ok'); S.apiOk=true; }
  else { msg.textContent=L('Не удалось подключиться: ','Could not connect: ')+errText(j); apiDot('bad'); }
}

function kbFor(c){
  var mk=String(c.make||''), md=String(c.model||''), tx=[c.title,c.rawModel,c.desc].join(' '), y=c.year||null, el=(typeof engineOf==='function'?engineOf(c):null)||c.engineL||null;
  if(!el){ var m=String(tx).match(/(?:^|[^\d])([0-6][.,]\d)\s*(?:l\b|tsi|tfsi|tdi|tdci|cdi|crdi|d-4d|dci|hdi|jtd|ecoboost|puretech|thp|vti|tce|gdi|d\b|i\b)/i); if(m) el=parseFloat(m[1].replace(',','.')); }
  var mt=md+' '+String(tx).slice(0,200);
  if(!el&&/^bmw$/i.test(mk)){ var b=mt.match(/\b(?:[1-7]|x[1-7])?\s?\d(1[68]|2[05]|3[05]|4[05])(d|i)\b/i)||mt.match(/\b[1-7](1[68]|2[05]|3[05]|4[05])(d|i)?\b/i); if(b){ var n=+b[1]; el=n<=20?2.0:n<=25?(b[2]&&/d/i.test(b[2])?2.0:2.0):3.0; } }
  if(!el&&/^mercedes/i.test(mk)){ var b2=mt.match(/\b[a-z]{0,3}\s?(180|200|220|250|300|350)\s?(cdi|d|bluetec)\b/i); if(b2) el=+b2[1]<=250?2.1:3.0; }
  var f=c.fuel==='lpg'?'petrol':c.fuel;
  return KB.filter(function(k){
    if(k.m&&!k.m.test(mk)) return false;
    if(k.md&&!k.md.test(md)&&!k.md.test(tx.slice(0,300))) return false;
    if(k.y&&y&&(y<k.y[0]||y>k.y[1])) return false;
    if(k.f==='hybrid'){ if(f!=='hybrid'&&!/hybrid|hibr[iī]d|гибрид/i.test(tx)) return false; }
    else if(k.f&&f!==k.f) return false;
    if(k.g&&c.gear!==k.g) return false;
    if(k.el&&(!el||el<k.el[0]-0.05||el>k.el[1]+0.05)) return false;
    if(k.notx&&k.notx.test(tx)) return false;
    if(k.tx&&!k.tx.test(tx)&&!(k.soft&&(!k.softm||k.softm.test(mk)))) return false;
    return true;
  });
}

function dayDiff(iso){ if(!iso) return null; var d=new Date(String(iso).slice(0,10)+'T12:00:00'); if(isNaN(d)) return null; return Math.max(0,Math.round((Date.now()-d.getTime())/86400000)); }
function dLoc(){ return S.lang==='ru'?'ru-RU':S.lang==='lv'?'lv-LV':'en-GB'; }
function dFmt(iso,time){ if(!iso) return '–'; var d=new Date(String(iso).length>10?iso:String(iso)+'T12:00:00'); if(isNaN(d)) return '–'; return d.toLocaleDateString(dLoc(),{day:'numeric',month:'short',year:'numeric'})+(time&&String(iso).length>10?' '+String(iso).slice(11,16):''); }
function nDays(n){ if(S.lang==='ru'){ var m=n%10,h=n%100; return n+' '+(m===1&&h!==11?'день':m>=2&&m<=4&&(h<12||h>14)?'дня':'дней'); } if(S.lang==='lv') return n+' '+(n%10===1&&n%100!==11?'diena':'dienas'); return n+(n===1?' day':' days'); }
function nCars(n){ if(S.lang==='ru'){ var m=n%10,h=n%100; return n+' '+(m===1&&h!==11?'машина':m>=2&&m<=4&&(h<12||h>14)?'машины':'машин'); } if(S.lang==='lv') return n+' '+(n%10===1&&n%100!==11?'auto':'auto'); return n+(n===1?' car':' cars'); }

  }
  if(o.views!=null&&o.days!=null){ o.vpd=o.views/Math.max(1,o.days); }

/* engine size (litres) in a whole pasted page / OCR text: a labelled value first ("Motora tilpums 1995 cm3", "Объём двигателя 2.0"),
   then a size next to an engine code (2.0 TDI) or "cm3". A bare "6.5 l/100 km" (consumption) is not an engine size. */
function engineFromText(t){
  t=String(t||'').slice(0,12000);
  var fromCc=function(n){ return n>=500&&n<=8000?Math.round(n/100)/10:null; };
  var m=t.match(/(?:motora\s+tilpums|dzin[ēe]ja\s+tilpums|tilpums|объ[её]м\s+двигателя|рабочий\s+объ[её]м|engine\s+(?:size|capacity|displacement)|displacement|hubraum|mootori\s+maht)[^0-9]{0,15}(\d[.,]\d|\d{3,4})\s*(cm\s?[³3]|см\s?[³3]|ccm|cc\b|l\b|л\b)?/i);
  if(m){ var raw=m[1], v=/[.,]/.test(raw)?parseFloat(raw.replace(',','.')):fromCc(parseInt(raw,10)); if(v>0.5&&v<8) return Math.round(v*10)/10; }
  m=t.match(/(?:^|[^\d.,])(\d{3,4})\s*(?:cm\s?[³3]|см\s?[³3]|ccm)(?![a-z0-9])/i);
  if(m){ var v2=fromCc(parseInt(m[1],10)); if(v2) return v2; }
  m=t.match(/(?:^|[^\d.,])([0-7][.,]\d)\s*(?:tsi|tfsi|tdi|tdci|cdi|crdi|d-4d|dci|hdi|jtd|ecoboost|puretech|thp|vti|tce|gdi|mpi|fsi)/i)
   ||t.match(/(?:^|[^\d.,])([0-7][.,]\d)\s*(?:l|л)\b(?!\s*\/)/i);
  if(m){ var v3=parseFloat(m[1].replace(',','.')); if(v3>0.5&&v3<8) return v3; }
  return null;
}

function fitPrice(items){
  /* price ~ a + b*year + c*km (least squares); falls back to year medians */
  var X=items.filter(function(i){return i.year&&i.km!=null&&i.price>0});
  if(X.length>=10){
    var n=X.length, my=0,mk=0,mp=0; X.forEach(function(i){my+=i.year;mk+=i.km;mp+=i.price}); my/=n; mk/=n; mp/=n;
    var syy=0,skk=0,syk=0,syp=0,skp=0; X.forEach(function(i){var a=i.year-my,b=i.km-mk,p=i.price-mp; syy+=a*a; skk+=b*b; syk+=a*b; syp+=a*p; skp+=b*p;});
    var det=syy*skk-syk*syk;
    if(Math.abs(det)>1e-6){ var by=(syp*skk-skp*syk)/det, bk=(skp*syy-syp*syk)/det;
      if(bk<0&&by>0) return function(i){ return mp+by*((i.year||my)-my)+bk*((i.km!=null?i.km:mk)-mk); }; }
  }
  var byY={}; items.forEach(function(i){ if(i.year){ (byY[i.year]=byY[i.year]||[]).push(i.price); } });
  var all=median(items.map(function(i){return i.price}));
  return function(i){ var a=byY[i.year]; return a&&a.length>=3?median(a):all; };
}

  return h;
}
/* one search over the chosen markets: every listing scored against its own market (no DOM) */
async function finderCore(p){
  var mk=p.mk||{}, cm=cleanMakeModel(p.make,p.model); if(!cm.make||!cm.model||!S.api) return null;
  var yf=p.yf||(p.yt?p.yt-3:null), yt=p.yt||(p.yf?p.yf+3:null), ymid=yf&&yt?Math.round((yf+yt)/2):(yf||yt||null);
  var base={make:cm.make,model:cm.model,year:ymid||'',yfrom:yf||'',yto:yt||'',fuel:p.fuel||''};
  var jobs=[], AS={DE:'D',BE:'B',NL:'NL',FR:'F'};
  if(mk.LV) jobs.push(api('/api/comps',Object.assign({source:'ss'},base),55000).then(function(j){return {region:'LV',label:'ss.lv',j:j}}));
  if(mk.LT) jobs.push(api('/api/comps',Object.assign({source:'autoplius'},base),55000).then(function(j){return {region:'LT',label:'autoplius.lt',j:j}}));
  if(mk.EE) jobs.push(api('/api/comps',Object.assign({source:'autoportaal'},base),55000).then(function(j){return {region:'EE',label:'autoportaal.ee',j:j}}));
  Object.keys(AS).forEach(function(r){ if(mk[r]) jobs.push(api('/api/comps',Object.assign({source:'as24',cy:AS[r]},base),55000).then(function(j){return {region:r,label:'AutoScout24 '+r,j:j}})); });
  if(!jobs.length) return {rows:[],notes:[],scanned:0,cm:cm,none:true};
  var res=await Promise.all(jobs), rows=[], notes=[];
  res.forEach(function(r){
    var j=r.j||{}; if(!j.ok){ notes.push(function(){ return r.label+': '+errText(j); }); return; }
    var seen={}, its=(j.items||[]).filter(function(i){ var id=listingId(i.url)||i.url; if(seen[id]) return false; seen[id]=1; return i.price>=500&&i.year&&(!yf||i.year>=yf)&&(!yt||i.year<=yt)&&(!p.fuel||!i.fuel||(i.fuel==='lpg'?'petrol':i.fuel)===p.fuel); });
    if(its.length<5){ var nn=its.length; notes.push(function(){ return r.label+': '+L('мало объявлений','too few listings','par maz sludinājumu')+' ('+nn+')'; }); return; }
    var mid=median(its.map(function(i){return i.price})); its=its.filter(function(i){return i.price>mid*0.3&&i.price<mid*3});
    var est=fitPrice(its);
    its.forEach(function(i){ var e=est(i); if(!(e>0)) return; var d=(i.price-e)/e*100;
      if(p.pmax&&i.price>p.pmax) return; if(p.kmax&&i.km!=null&&i.km>p.kmax) return; if(p.gear&&i.gear&&i.gear!==p.gear) return;
      rows.push(Object.assign({region:r.region,src:r.label,exp:Math.round(e/50)*50,d:d,n:its.length},i)); });
  });
  rows.sort(function(a,b){return a.d-b.d});
  return {rows:rows,notes:notes,scanned:res.reduce(function(a,r){return a+((r.j&&r.j.items)||[]).length},0),cm:cm};
}
async function runFinder(){
  var g=function(id){ var e=document.getElementById(id); return e?String(e.value||'').trim():''; }, gi=function(id){ var x=g(id).replace(/[^\d]/g,''); return x?parseInt(x,10):null; };
  var mk={}; document.querySelectorAll('[data-fmk]').forEach(function(x){ mk[x.getAttribute('data-fmk')]=x.checked?1:0; });
  var p={make:g('fd-make'),model:g('fd-model'),yf:gi('fd-yf'),yt:gi('fd-yt'),pmax:gi('fd-pmax'),kmax:gi('fd-kmax'),fuel:g('fd-fuel'),gear:g('fd-gear'),mk:mk};
  LS.set(KEY_FIND,JSON.stringify(p));
  var cm=cleanMakeModel(p.make,p.model); if(!cm.make||!cm.model){ showStatus('err',function(){return L('Укажите марку и модель.','Enter the make and model.','Norādiet marku un modeli.')}); return; }
  if(!S.api){ showStatus('err',function(){return L('Нужен сервер (кнопка «Сервер»).','The server is needed (the “Server” button).','Nepieciešams serveris (poga «Serveris»).')}); return; }
  if(!Object.keys(mk).some(function(k){return mk[k]})){ showStatus('err',function(){return L('Отметьте хотя бы один рынок.','Tick at least one market.','Atzīmējiet vismaz vienu tirgu.')}); return; }
  var outEl=document.getElementById('find-out'); if(outEl) outEl.innerHTML='<p class="anote">'+esc(L('Ищу на рынках… Обычно 15–40 секунд.','Searching the markets… Usually 15–40 seconds.','Meklēju tirgos… Parasti 15–40 sekundes.'))+'</p>';
  var D=await finderCore(p); if(!D) return;

  showStatus('ok',function(){return L('Поиск завершён.','Search finished.','Meklēšana pabeigta.')});
}

/* ======================= BETA: price-drop arrows, price at the start of sale, cost of the trip =======================

/*BETA-PURE-START*/
var DROP_DAYS=5, TRIP_BETA=true;
var FUEL_REF={date:'2026-09-28',petrol:2.038,diesel:2.133};
/* A drop counts only when the price fell within the last `days` days and has not gone back up since. */
function recentDrop(hist,now,days){
  var ps=[]; (hist||[]).filter(function(x){return x&&x.p>0&&x.t>0}).sort(function(a,b){return a.t-b.t}).forEach(function(x){ if(!ps.length||ps[ps.length-1].p!==x.p) ps.push(x); });

  return {from:ps[i].p,to:ps[ps.length-1].p,t:ps[ps.length-1].t,steps:steps};
}
/* The memory may lag behind the page: if the ad shows a different price than the last stored one, that is a change seen now. */
function histWithNow(hist,price,now){
  var h=(hist||[]).filter(function(x){return x&&x.p>0&&x.t>0}).sort(function(a,b){return a.t-b.t}), last=h[h.length-1];

/* Rough litres per 100 km by fuel and engine size: a guide for the class of engine, not for this very car. */
function tripCons(fuel,eL){

function tripPrice(fuel){ return fuel==='diesel'?FUEL_REF.diesel:FUEL_REF.petrol; }
function tripCost(km,legs,cons,price){ return Math.round(km*legs*cons/100*price); }
/* gain = how many euros the car is below the market price (negative: above it); null when there is no market comparison */
function tripSum(cost,gain){

  if(draw){ ctx.fillStyle='#F7F5F0'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#D8F26A'; ctx.fillRect(0,0,W,14); }
  if(draw){ font('700',34); ctx.fillStyle=ink; ctx.textAlign='left'; ctx.fillText('CarScout',P,y+30); font('400',28); ctx.fillStyle=mut; ctx.textAlign='right'; ctx.fillText(memDate(Date.now()),W-P,y+30); ctx.textAlign='left'; }

  if(draw){ ctx.fillStyle=d.priceNote?ink:mut; ctx.fillText(d.price,P,y+Math.round(ps*0.875)); } y+=ps;
  para(d.priceNote,'400',30,mut,1);

  if(d.plan){ rule(); para(d.plan,'600',38,ink,3); }

}

function trendSpark(ws){

  var W=360, H=64, lo=Math.min.apply(null,pts.map(function(w){return w.med})), hi=Math.max.apply(null,pts.map(function(w){return w.med})), pad=(hi-lo)*0.15||hi*0.02;

    if(me){ var keep=(me.value||'').split(',').map(function(s){return s.trim()}).filter(Boolean).every(function(m){ return mk&&MODEL_CAT[mk].concat(mid==='fz-model'?varAll(mk):[]).some(function(x){ return pickNorm(x)===pickNorm(m)||pickNorm(m).indexOf(pickNorm(x))===0; }); });
      if(!keep){ me.value=''; me.dispatchEvent(new Event('input',{bubbles:true})); }
      pickClose(); setTimeout(function(){ me.focus(); pickOpen(me,true); },30); return; } }
  /* the list closes after every pick (also when several models can be chosen: tap the field again to add one) */
  pickClose(); inp.blur();
}
document.addEventListener('focusin',function(e){ var t=e.target; if(pickIs(t)){ t.setAttribute('autocomplete','off'); if(PICK_TOUCH) t.setAttribute('inputmode','none'); if(!(pickCur===t&&document.getElementById('pickpanel'))) pickOpen(t,true); } });
document.addEventListener('input',function(e){ var t=e.target;
  if(t&&t.classList&&t.classList.contains('pk-q')&&pickCur){ pickOpen(pickCur); return; }
  if(pickIs(t)&&document.activeElement===t) pickOpen(t,false,true); });
document.addEventListener('click',function(e){ var t=e.target; if(pickIs(t)&&!document.getElementById('pickpanel')) pickOpen(t,true); });
/* pointerdown keeps the focus where it is, so the list does not close before the tap lands (the search box itself may take the focus) */
document.addEventListener('pointerdown',function(e){ var o=e.target.closest&&e.target.closest('#pickpanel'); if(o&&!e.target.classList.contains('pk-q')) e.preventDefault(); });
document.addEventListener('click',function(e){ var o=e.target.closest&&e.target.closest('#pickpanel .pk-o'); if(o&&pickCur){ e.preventDefault(); pickChoose(pickCur,o.getAttribute('data-v')); return; }
  var r=e.target.closest&&e.target.closest('#pickpanel .pk-rm'); if(r&&pickCur){ e.preventDefault(); var v=pickNorm(r.getAttribute('data-v')); pickCur.value=(pickCur.value||'').split(',').map(function(x){return x.trim()}).filter(function(x){ return x&&pickNorm(x)!==v; }).join(', ');
    pickCur.dispatchEvent(new Event('input',{bubbles:true})); pickOpen(pickCur,true); } });
document.addEventListener('focusout',function(e){ var t=e.target, p=document.getElementById('pickpanel');
  if(pickCur&&(t===pickCur||(p&&p.contains(t)))) setTimeout(function(){ var a=document.activeElement, p2=document.getElementById('pickpanel'); if(pickCur&&a!==pickCur&&!(p2&&p2.contains(a))) pickClose(); },160);
  if(t&&PICK_MULTI[t.id]) t.value=String(t.value||'').replace(/[,\s]+$/,''); });
document.addEventListener('keydown',function(e){ var p=document.getElementById('pickpanel'); if(!pickCur||!p||(e.target!==pickCur&&!e.target.classList.contains('pk-q'))) return; var os=p.querySelectorAll('.pk-o'); if(e.key==='Escape'){ pickClose(); return; } if(!os.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); pickHi=(pickHi+(e.key==='ArrowDown'?1:-1)+os.length)%os.length; os.forEach(function(o,i){ o.classList.toggle('hi',i===pickHi); }); os[pickHi].scrollIntoView({block:'nearest'}); }
  else if(e.key==='Enter'){ var k=pickHi>=0?pickHi:(e.target.classList.contains('pk-q')&&os.length?0:-1); if(k>=0){ e.preventDefault(); pickChoose(pickCur,os[k].getAttribute('data-v')); } } });

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b) return;
  var a=b.getAttribute('data-act');
  if(a==='stop') stopRun();
  else if(a==='set-trim'){ $('#intake').classList.add('open'); var m=$('#manual'); m.open=true; var t=$('#f-trim'); t.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){t.focus()},350); showStatus('info',function(){return L('Впишите комплектацию (например R-Line) и нажмите «Проверить автомобиль».','Type the trim (for example R-Line) and press “Check this car”.')}); }
  else if(a==='fav-toggle') favToggle();
  else if(a==='recheck') applyCheck();
  else if(a==='more'){ var fm=$('#intake'); fm.classList.toggle('open'); b.setAttribute('aria-expanded',fm.classList.contains('open')?'true':'false'); }
  else if(a==='go-comps'){ var gc=document.getElementById('a-near')||document.getElementById('a-scatter'); if(gc){ var yg=gc.getBoundingClientRect().top+window.scrollY-80; window.scrollTo({top:yg,behavior:'smooth'}); } }
  else if(a==='hreg'){ S.histReg=b.getAttribute('data-r'); var hp=document.getElementById('a-hist'); if(hp&&S.view){ var nh=pHist(S.view,S.histReg); var tmp=document.createElement('div'); tmp.innerHTML=nh; hp.parentNode.replaceChild(tmp.firstChild,hp); } }
  else if(a==='ck-tab'){ var pn=b.closest('.ap'); pn.querySelectorAll('[data-act=ck-tab]').forEach(function(x){x.classList.toggle('on',x===b)}); pn.querySelectorAll('.cklist').forEach(function(x){x.hidden=x.getAttribute('data-t')!==b.getAttribute('data-t')}); }
  else if(a==='go-acc'){ var ac=document.getElementById('a-acc'); if(ac){ var yy=ac.getBoundingClientRect().top+window.pageYOffset-(aMob()?70:16); window.scrollTo({top:Math.max(0,yy),behavior:'smooth'}); } }
  else if(a==='go-msg'){ var ms=document.getElementById('sec-msg'); if(ms) ms.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(a==='nav-top'){ window.scrollTo({top:0,behavior:'smooth'}); }
  else if(a==='nav-favs'||a==='nav-compare'){ var fv=document.getElementById('favs'); if(fv&&!fv.hidden){ fv.scrollIntoView({behavior:'smooth',block:'start'}); if(a==='nav-compare'&&favLoad().filter(function(x){return x.sel}).length<2) showStatus('info',function(){return L('Отметьте в избранном 2–3 машины, чтобы сравнить их рядом.','Tick 2–3 favourites to compare them.')}); } else showStatus('info',function(){return L('Избранное пусто: нажмите «☆ В избранное» в карточке машины.','No favourites yet: press “☆ Save” on a car card.')}); }
  else if(a==='nav-hist'){ var hb=document.getElementById('hist'); renderHist(!(hb&&!hb.hidden)); var hb2=document.getElementById('hist'); if(hb2&&!hb2.hidden) hb2.scrollIntoView({behavior:'smooth',block:'start'}); }

  else if(a==='hist-open'){ var hx=histLoad()[+b.getAttribute('data-i')]; if(hx&&hx.url){ $('#f-url').value=hx.url; renderHints(); window.scrollTo({top:0,behavior:'smooth'}); run(); } }
  else if(a==='fav-rm'){ var fa=favLoad(); fa.splice(+b.getAttribute('data-i'),1); favSave(fa); render(); }
  else if(a==='fav-recheck') favRecheck(false);
  else if(a==='copy-sum'){ if(S.view) copyText(shareText(S.view),L('Сводка скопирована.','Summary copied.')); }
  else if(a==='share-sum'){ if(S.view&&navigator.share) navigator.share({title:'CarScout',text:shareText(S.view)}).catch(function(){}); }
  else if(a==='share-img') shareImage();
  else if(a==='print') window.print();
  else if(a==='refresh') refreshApp();
  else if(a==='copy-msg'){ var ta=$('#msg-text'); if(ta) copyText(ta.value,L('Сообщение скопировано.','Message copied.')); }
  else if(a==='copy-vin'){ if(S.view&&S.view.car&&S.view.car.vin) copyText(S.view.car.vin,L('VIN скопирован.','VIN copied.')); }
  else if(a==='report'){ if(S.view) copyText(reportText(S.view),L('Отчёт скопирован. Вставьте его в чат с Claude.','Report copied. Paste it into the chat with Claude.')); }
  else if(a==='rm-img'){ var im=S.images.splice(+b.getAttribute('data-i'),1)[0]; if(im) URL.revokeObjectURL(im.url); renderThumbs(); }
});

  S.connP=(S.api||API_DEFAULT)?connect().then(function(ok){ if(ok){ favAutoCheck(); huntAutoCheck(); } return ok; }):Promise.resolve(false);

  /* ---------- install as an app (PWA) ---------- */
(function(){
  var deferred=null, btn=$('#btn-install');
  var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e; if(btn&&!standalone) btn.hidden=false; });
  window.addEventListener('appinstalled',function(){ deferred=null; if(btn) btn.hidden=true; showStatus('ok',function(){return L('Приложение установлено.','App installed.')}); });
  if(ios&&!standalone&&btn) btn.hidden=false;
  if(btn) btn.addEventListener('click',function(){
    if(deferred){ deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; btn.hidden=true; }); }
    else if(ios) showStatus('info',function(){return L('На iPhone: нажмите «Поделиться» в Safari и выберите «На экран “Домой”».','On iPhone: tap “Share” in Safari and choose “Add to Home Screen”.')});
    else showStatus('info',function(){return L('Откройте меню браузера (три точки) и выберите «Установить приложение» или «Добавить на главный экран».','Open the browser menu (three dots) and choose “Install app” or “Add to Home screen”.')});
  });
})();
