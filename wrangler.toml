# Cloudflare reads this file when the repository is connected (Workers & Pages > Create > Import a repository).
name = "carscout"
main = "worker/worker.js"
compatibility_date = "2025-01-01"

[vars]
# Only your own page may call this server from a browser.
ALLOW_ORIGIN = "https://digitalcreatorhub.github.io"

# CarScout memory: listings seen before (price and mileage over time). Created in Cloudflare > Storage & Databases > D1.
[[d1_databases]]
binding = "DB"
database_name = "carscout-memory"
database_id = "74f04bac-7736-4dcc-8e9f-32bb22123206"

# Every 5 minutes: answer new /start and /stop messages of the Telegram bot.
[triggers]
crons = ["*/5 * * * *"]

# OPTIONAL, off by default: Cloudflare's own request limiter (exact across the world, unlike the built-in counter in the
# worker, which is per server instance). Whether it is available on the free plan was not confirmed when this was written,
# so it is not switched on. To try it, remove the "#" signs and deploy; if the deploy is refused, put them back. The worker
# uses the binding named RATE when it exists and works the same without it.
# [[ratelimits]]
# name = "RATE"
# namespace_id = "1001"
# [ratelimits.simple]
# limit = 120
# period = 60
