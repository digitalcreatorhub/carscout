    <!-- WebMCP — exposes site actions to AI agents in the browser via the
         Model Context Protocol's web binding. Spec is still experimental
         (https://webmachinelearning.github.io/webmcp/), so we feature-detect
         and silently no-op when navigator.modelContext is unavailable. Tools
         declared here mirror the same surface as /.well-known/agent-skills/. -->
    <script>
      (function () {
        try {
          if (!navigator || !navigator.modelContext || typeof navigator.modelContext.provideContext !== 'function') return;
          navigator.modelContext.provideContext({
            tools: [
              {
                name: 'vin-decode',
                description: 'Decode a 17-character Vehicle Identification Number (VIN) to year, make, model, trim, engine, and other build specs. Free, instant.',
                inputSchema: {
                  type: 'object',
                  required: ['vin'],
                  properties: {
                    vin: { type: 'string', pattern: '^[A-HJ-NPR-Z0-9]{17}$', description: '17-character VIN' },
                  },
                },
                execute: async (input) => {
                  var vin = String(input.vin || '').toUpperCase();
                  var res = await fetch('/api/vin/preview/' + encodeURIComponent(vin));
                  return await res.json();
                },
              },
              {
                name: 'recall-lookup',
                description: 'Look up open NHTSA safety recalls for a vehicle by VIN. Free.',
                inputSchema: {
                  type: 'object',
                  required: ['vin'],
                  properties: { vin: { type: 'string', pattern: '^[A-HJ-NPR-Z0-9]{17}$' } },
                },
                execute: async (input) => {
                  var res = await fetch('/api/recalls/' + encodeURIComponent(String(input.vin).toUpperCase()));
                  return await res.json();
                },
              },
              {
                name: 'auction-search',
                description: 'Search Copart and IAAI salvage auction lots by make, model, year range, damage type, price, and odometer.',
                inputSchema: {
                  type: 'object',
                  properties: {
                    make: { type: 'string' },
                    model: { type: 'string' },
                    yearMin: { type: 'integer', minimum: 1990 },
                    yearMax: { type: 'integer', maximum: 2030 },
                    damage: { type: 'string', description: 'Comma-separated damage types' },
                    page: { type: 'integer', minimum: 1, default: 1 },
                  },
                },
                execute: async (input) => {
                  var params = new URLSearchParams();
                  Object.keys(input || {}).forEach(function (k) {
                    if (input[k] != null && input[k] !== '') params.set(k, String(input[k]));
                  });
                  var res = await fetch('/api/auction/search?' + params.toString());
                  return await res.json();
                },
              },
              {
                name: 'auction-by-vin',
                description: 'Get all Copart/IAAI auction records (photos, damage, sale price) for a specific VIN.',
                inputSchema: {
                  type: 'object',
                  required: ['vin'],
                  properties: { vin: { type: 'string', pattern: '^[A-HJ-NPR-Z0-9]{17}$' } },
                },
                execute: async (input) => {
                  var res = await fetch('/api/vin/auction?vin=' + encodeURIComponent(String(input.vin).toUpperCase()));
                  return await res.json();
                },
              },
            ],
          });
        } catch (e) {
          // WebMCP not available or threw — silently skip. Agents that don't
          // support the API will use /.well-known/api-catalog and /openapi.json
          // for discovery instead.
        }
      })();
    </script>

    <!-- Subscribe with Google (SwG) — only meaningful on NewsArticle-typed

    <script>

        var s = document.createElement('script');
        s.async = true;
        s.type = 'application/javascript';
        s.src = 'https://news.google.com/swg/js/v1/swg-basic.js';
        document.head.appendChild(s);
        (self.SWG_BASIC = self.SWG_BASIC || []).push(function (basicSubscriptions) {
          basicSubscriptions.init({
            type: 'NewsArticle',
            isPartOfType: ['Product'],
            isPartOfProductId: 'CAowhpW3DA:openaccess',
            clientOptions: { theme: 'light', lang: 'en' },
          });
        });
      })();
    </script>
