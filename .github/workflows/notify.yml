name: Alerts (Telegram and phone notifications)
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: telegram-alerts
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Phone notifications for saved car searches
        continue-on-error: true
        run: node tools/pushtick.mjs
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: tgstate
          key: tgstate-${{ github.run_id }}
          restore-keys: tgstate-
      - name: Send alerts
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: node tools/notify.mjs
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tgstate
          key: tgstate-${{ github.run_id }}
