name: Offline checks
# Runs the offline tests on every change of the worker, the page or the tests (and on pull requests, before a merge
# deploys the worker): time on sale, request limits, database clean-up, page readers, generation from photos, accounts.
# No network and no secrets: a real SQLite database, fixed test pages and a fixed clock.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'index.html'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/workflows/lifecheck.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'index.html'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/workflows/lifecheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node --no-warnings tools/lifecheck.mjs
      - run: node --no-warnings tools/ratecheck.mjs
      - run: node --no-warnings tools/dbcheck.mjs
      - run: node --no-warnings tools/parsercheck.mjs
      - run: node --no-warnings tools/photocheck.mjs
      - run: node --no-warnings tools/accountcheck.mjs
      - run: node --no-warnings tools/readmecheck.mjs
