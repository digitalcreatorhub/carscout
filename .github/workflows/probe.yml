name: probe moto pages (temporary)
on: { push: { branches: [probe-moto-pages] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd probe && node probe.mjs
      - uses: actions/upload-artifact@v4
        with: { name: pages, path: probe/out }
