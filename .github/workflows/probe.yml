name: probe
on:
  push:
    branches: [probe]
    paths: ['.github/workflows/probe.yml', 'probe.sh', 'rec.mjs']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          mkdir -p out; npm i --no-save playwright@1.47.2 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          bash probe.sh || true
          node rec.mjs || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out; git commit -qm "probe out [skip ci]" || true; git push
