name: probe
on:
  push:
    branches: [probe]
    paths: ['.github/workflows/probe.yml', 'probe.sh']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out; bash probe.sh || true
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add out; git commit -qm "probe out [skip ci]" || true; git push
